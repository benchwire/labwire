[project]
name = "labwire-workspace"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "packages/bridges/*"]
# packages/bridges is a grouping directory, not a distribution
exclude = ["packages/bridges"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest-timeout>=2.4.0",
    "anthropic>=0.119.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "PT", "T20", "D"]
# ASYNC109: timeout= parameters on request()/result() are a deliberate API choice
ignore = ["ASYNC109", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"examples/**" = ["T20", "D"]
"docs/**" = ["T20", "D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "tests"]
addopts = "-q"
timeout = 60

[tool.coverage.run]
source_pkgs = ["labwire.core"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
