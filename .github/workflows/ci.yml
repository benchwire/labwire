name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=term-missing

  core-without-bridge-dependencies:
    # ophyd and pylabrobot are optional dependencies of the bridge packages:
    # the rest of the workspace must import and pass without either installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Remove the optional bridge dependencies
        run: uv pip uninstall ophyd pylabrobot
      - name: Confirm they really are absent
        run: |
          for module in ophyd pylabrobot; do
            if uv run --no-sync python -c "import $module" 2>/dev/null; then
              echo "$module is still installed; this job proves nothing" >&2
              exit 1
            fi
            echo "$module absent, as intended"
          done
      - name: labwire-core must still pass
        run: uv run --no-sync pytest packages/core/tests -q
      - name: The bridge's pure layers must still import
        # addressing and introspection are duck-typed and import no PyLabRobot.
        run: |
          uv run --no-sync python -c "
          from labwire.bridges.pylabrobot import command_surface, split_deck_uri
          assert split_deck_uri('labwire:deck/plate/A1') == ('plate', 'A1')
          assert len(command_surface()) == 9
          print('pure layers import without pylabrobot')
          "
