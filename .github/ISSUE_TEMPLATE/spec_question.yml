name: Spec question or issue
description: A section of SPEC.md is ambiguous, wrong, or missing something.
labels: [spec]
body:
  - type: markdown
    attributes:
      value: |
        Spec feedback is the most valuable kind this project gets. Where the
        implementation taught us the spec was wrong, it is written down in
        SPEC-FINDINGS.md; your report may become the next finding.
  - type: input
    id: section
    attributes:
      label: Spec section
      placeholder: "SPEC 10.4"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question or problem
      description: What the text says, what you think it should say or clarify, and what a conforming implementation cannot decide without an answer.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you were building
      description: Optional, but interoperability questions land better with the concrete case that raised them.
