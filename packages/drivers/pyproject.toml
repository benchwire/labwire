[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labwire-drivers"
version = "0.4.0"
description = "Labwire instrument drivers speaking native wire protocols (SCPI/TCP, serial-style)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Silous Ramelli" }]
dependencies = ["labwire-core", "pyyaml>=6"]

[project.optional-dependencies]
serial = ["pyserial-asyncio-fast>=0.16", "pyserial>=3.5"]

[dependency-groups]
dev = ["labwire-sim", "pyserial-asyncio-fast>=0.16", "pyserial>=3.5"]

[tool.uv.sources]
labwire-core = { workspace = true }
labwire-sim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/labwire"]
