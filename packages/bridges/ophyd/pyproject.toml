[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labwire-ophyd"
version = "0.4.1"
description = "Expose ophyd (Bluesky) devices as Labwire instruments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Silous Ramelli" }]
dependencies = ["labwire-core>=0.4.1,<0.5", "pyyaml>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
# ophyd is optional: the bridge is only usable with it, but labwire-core must
# never depend on it, and the rest of the workspace must import without it.
ophyd = ["ophyd>=1.9,<2"]

[project.scripts]
labwire-ophyd = "labwire.bridges.ophyd.cli:main"

[dependency-groups]
# caproto provides a pure-Python soft IOC and control layer, so the
# Channel Access tests need no EPICS base install.
dev = ["ophyd>=1.9", "caproto>=1.1"]

[tool.uv.sources]
labwire-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/labwire"]
