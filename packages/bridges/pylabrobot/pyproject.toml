[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labwire-pylabrobot"
version = "0.5.0"
description = "Expose PyLabRobot liquid handlers as Labwire instruments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Silous Ramelli" }]
dependencies = ["labwire-core>=0.5,<0.6", "pyyaml>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
# PyLabRobot is optional: the bridge is only usable with it, but labwire-core
# must never depend on it, and the rest of the workspace must import without it.
pylabrobot = ["pylabrobot>=0.2,<0.3"]

[project.scripts]
labwire-pylabrobot = "labwire.bridges.pylabrobot.cli:main"

[dependency-groups]
# Bounded like the shipped extra: a PLR 1.x release on PyPI must not be
# pulled under main's own CI; the plr-canary workflow is where the v1b1
# branch gets exercised, deliberately.
dev = ["pylabrobot>=0.2,<0.3", "httpx>=0.27,<1"]

[tool.uv.sources]
labwire-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/labwire"]
